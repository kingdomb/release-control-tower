name: Deploy to GitHub Pages

# Deploys only from a semantic version tag (v0.1.0, v0.2.0, ...), and only after every
# quality gate in ci.yml passes on that exact commit.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json ($pkg)"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o page.html -w "%{http_code}" "$url")
            js=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' page.html | head -1)
            css=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.css' page.html | head -1)
            if [ "$code" = "200" ] && [ -n "$js" ] && [ -n "$css" ]; then
              jscode=$(curl -s -o app.js -w "%{http_code}" "${url}${js}")
              csscode=$(curl -s -o /dev/null -w "%{http_code}" "${url}${css}")
              # The bundle must load and contain the rule engine, not just the HTML shell.
              if [ "$jscode" = "200" ] && [ "$csscode" = "200" ] && grep -q "outside-maintenance" app.js; then
                echo "Live: $url (index 200, $js 200, $css 200)"; exit 0
              fi
            fi
            sleep 10
          done
          echo "Smoke test failed for $url"; exit 1
